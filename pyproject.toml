[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirq-sandbox"
version = "0.1.0"
description = "Quantum circuits on Google's Cirq Quantum Virtual Machine sandbox, with an opt-in path to the real cirq_google cloud Engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cirq-core>=1.4.1",
    "cirq-google>=1.4.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "networkx>=3.0",
    "fastapi>=0.110.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "services/api"]
